<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>golangci-lint playground (WASM PoC)</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --fg: #1d1d1b; --muted: #6b6b66; --border: #dcdcd6;
    --accent: #0b6bcb; --accent-fg: #ffffff; --warn: #a15c00; --err: #b3261e; --ok: #1e7b34;
    --code-bg: #fbfbfa; --hl: #fff3c4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --panel: #1f1f1d; --fg: #e8e8e3; --muted: #9c9c95; --border: #3a3a36;
      --accent: #5aa9f0; --accent-fg: #0d1b29; --warn: #e0a24a; --err: #f08a80; --ok: #7ccf8e;
      --code-bg: #1a1a19; --hl: #4a3f12;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 16px;
           border-bottom: 1px solid var(--border); background: var(--panel); }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  h1 small { color: var(--muted); font-weight: 400; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--accent);
           background: var(--accent); color: var(--accent-fg); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: var(--muted); font-size: 13px; flex: 1; min-width: 200px; }
  main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; padding: 12px 16px; }
  @media (max-width: 800px) { main { grid-template-columns: minmax(0, 1fr); } }
  section { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  label { font-size: 12px; color: var(--muted); }
  textarea { width: 100%; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; tab-size: 4;
             color: var(--fg); background: var(--code-bg); border: 1px solid var(--border);
             border-radius: 6px; padding: 8px; resize: vertical; }
  #code { min-height: 420px; }
  #config { min-height: 160px; }
  #results { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px; min-height: 120px; }
  #results ul { list-style: none; margin: 0; padding: 0; }
  #results li { padding: 4px 6px; border-radius: 4px; cursor: pointer; overflow-wrap: anywhere; }
  #results li:hover { background: var(--hl); }
  .pos { font-family: ui-monospace, monospace; color: var(--muted); }
  .linter { font-weight: 600; color: var(--warn); }
  .linter.typecheck { color: var(--err); }
  .summary { margin-bottom: 6px; color: var(--muted); }
  .summary.clean { color: var(--ok); }
  .error { color: var(--err); white-space: pre-wrap; }
  details pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; max-height: 240px; overflow: auto; }
  progress { width: 120px; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>golangci-lint playground <small>WASM PoC</small></h1>
  <button id="run" disabled>Run (Ctrl+Enter)</button>
  <span id="status">読み込み中…</span>
</header>
<main>
  <section>
    <label for="code">Go コード（複数ファイルは <code>-- name.go --</code> 区切りの txtar 形式）</label>
    <textarea id="code" spellcheck="false"></textarea>
  </section>
  <section>
    <label for="config">.golangci.yml（空ならデフォルト設定）</label>
    <textarea id="config" spellcheck="false"></textarea>
    <label>結果</label>
    <div id="results"><span class="summary">Run を押すと検査します。</span></div>
    <details><summary>golangci-lint のログ (stderr)</summary><pre id="stderr"></pre></details>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
