<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Run golangci-lint on Go code in your browser.">
  <title>golangci-lint playground</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b6bcb'/%3E%3Cpath d='M4 8.5l2.5 2.5L12 5' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
</head>
<body>
  <header class="toolbar">
    <h1>golangci-lint playground</h1>
    <label class="version">
      <span class="visually-hidden">golangci-lint version</span>
      <select id="version" disabled></select>
    </label>
    <button id="run" class="primary" disabled title="Ctrl+Enter / ⌘+Enter">Run</button>
    <button id="format" disabled title="Format with goimports and add missing imports (Shift+Alt+F)">Format</button>
    <button id="fix" disabled title="Fix all auto-fixable issues (golangci-lint run --fix)">Fix</button>
    <button id="cancel" hidden>Cancel</button>
    <button id="share" title="Copy a link to this code and configuration">Share</button>
    <label class="samples">
      <span class="visually-hidden">Samples</span>
      <select id="sample">
        <option value="">Open a sample…</option>
      </select>
    </label>
    <div id="status" class="status" role="status" aria-live="polite">
      <progress id="progress" hidden></progress>
      <span id="status-text">Loading…</span>
    </div>
  </header>
  <div id="notice" class="notice" hidden></div>
  <main class="layout">
    <section class="pane code-pane" aria-label="Go code">
      <div class="pane-header tabs-header">
        <div id="tabs" class="tabs" role="tablist" aria-label="Files"></div>
      </div>
      <div id="code" class="editor"></div>
    </section>
    <section class="pane config-pane" aria-label=".golangci.yml">
      <div class="pane-header">
        <span>.golangci.yml</span>
        <span class="header-actions">
          <button id="open-tools" class="link" disabled>Choose linters</button>
          <button id="reset-config" class="link">Reset to default</button>
        </span>
      </div>
      <div id="config" class="editor"></div>
    </section>
    <section class="pane results-pane" aria-label="Results">
      <div class="pane-header"><span>Results</span><span id="summary" class="hint"></span></div>
      <div id="results" class="results"><p class="placeholder">Press Run to lint with golangci-lint.</p></div>
      <details id="log-details" class="log" hidden>
        <summary>golangci-lint log</summary>
        <pre id="log"></pre>
      </details>
    </section>
  </main>
  <dialog id="tools-dialog" class="tools-dialog" aria-label="Linters and formatters"></dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
